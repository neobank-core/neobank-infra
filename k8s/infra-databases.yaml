# --- UNLEASH POSTGRES ---
---
apiVersion: v1
kind: Service
metadata:
  name: unleash-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: unleash-db
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unleash-db
spec:
  serviceName: "unleash-db"
  replicas: 1
  selector:
    matchLabels:
      app: unleash-db
  template:
    metadata:
      labels:
        app: unleash-db
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: "unleash"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: neobank-secrets
              key: unleash-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neobank-secrets
              key: unleash-password
        volumeMounts:
        - name: unleash-pgdata
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: unleash-pgdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: unleash
spec:
  ports:
    - port: 4242
      targetPort: 4242
  selector:
    app: unleash
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unleash
  template:
    metadata:
      labels:
        app: unleash
    spec:
      containers:
      - name: unleash
        image: unleashorg/unleash-server:5
        ports:
        - containerPort: 4242
        env:
        - name: DATABASE_HOST
          value: "unleash-db"
        - name: DATABASE_NAME
          value: "unleash"
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: neobank-secrets
              key: unleash-user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neobank-secrets
              key: unleash-password
        - name: DATABASE_SSL
          value: "false"
        - name: INIT_ADMIN_API_TOKENS
          valueFrom:
            secretKeyRef:
              name: neobank-secrets
              key: unleash-admin-api-token
        - name: INIT_CLIENT_API_TOKENS
          valueFrom:
            secretKeyRef:
              name: neobank-secrets
              key: unleash-api-token

