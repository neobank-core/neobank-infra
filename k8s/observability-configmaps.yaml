apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: api-gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["host.docker.internal:8080"]
    
      - job_name: user-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["host.docker.internal:8081"]
    
      - job_name: account-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["host.docker.internal:8082"]
    
      - job_name: card-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["host.docker.internal:8083"]
    
      - job_name: transaction-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["host.docker.internal:8084"]
    
      - job_name: admin-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["host.docker.internal:8086"]
    
      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["host.docker.internal:8087"]
    
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
data:
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json_lines
      }
    }
    
    filter {
      # Add any specific filtering here if needed
    }
    
    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "neobank-logs-%{+YYYY.MM.dd}"
        user => "elastic"
        password => "${ELASTIC_PASSWORD}"
      }
      stdout { codec => rubydebug }
    }
    
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-config
data:
  prometheus.yml: |
    apiVersion: 1
    
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
    
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiremock-config
data:
  3ds-initiate.json: |
    {
      "name": "3DS Initiate",
      "request": {
        "method": "POST",
        "url": "/mock/3ds/initiate"
      },
      "response": {
        "status": 200,
        "headers": {
          "Content-Type": "application/json"
        },
        "jsonBody": {
          "sessionToken": "{{randomValue type='UUID'}}",
          "mockOtp": "123456",
          "message": "OTP sent to mock phone number"
        },
        "transformers": ["response-template"]
      }
    }
    
  3ds-verify-failure.json: |
    {
      "name": "3DS Verify - Failure",
      "request": {
        "method": "POST",
        "url": "/mock/3ds/verify"
      },
      "response": {
        "status": 200,
        "headers": {
          "Content-Type": "application/json"
        },
        "jsonBody": { "verified": false, "reason": "Invalid OTP" }
      }
    }
    
  3ds-verify-success.json: |
    {
      "name": "3DS Verify - Success",
      "request": {
        "method": "POST",
        "url": "/mock/3ds/verify",
        "bodyPatterns": [
          { "equalToJson": "{\"otp\": \"123456\"}", "ignoreExtraElements": true }
        ]
      },
      "response": {
        "status": 200,
        "headers": {
          "Content-Type": "application/json"
        },
        "jsonBody": { "verified": true }
      }
    }
    
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Spring Boot Microservices'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
data:
  neobank-overview.json: |
    {
      "title": "NeoBank Overview",
      "tags": ["spring-boot"],
      "timezone": "browser",
      "panels": [
        {
          "type": "stat",
          "title": "Total JVM Memory",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes)",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }
