volumes:
  keycloak_data:
  user_pgdata:
  account_pgdata:
  transaction_pgdata:
  card_pgdata:
  notification_pgdata:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  neobank-network:
    driver: bridge
